  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--pink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main {
    height: 100vh; height: 100dvh;
    max-width: 96rem; margin: 0 auto;
    padding: var(--pad);
    display: flex; flex-direction: column; gap: clamp(.5rem, 1.4vh, 1rem);
  }

  /* Kopf */
  .head { display: flex; align-items: center; gap: clamp(.8rem, 2vw, 1.4rem); flex: none; }
  .crest {
    flex: none;
    width: clamp(2.8rem, 5.2vw, 4.2rem);
    aspect-ratio: 219 / 240;
    background: var(--pink);
    -webkit-mask: var(--logo) center / contain no-repeat;
            mask: var(--logo) center / contain no-repeat;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 3.4vw, 2.6rem);
    font-weight: 700; line-height: 1.05; letter-spacing: -0.03em;
  }
  .sub {
    margin: .35rem 0 0;
    font-size: clamp(1rem, 1.9vw, 1.3rem);
    font-weight: 600; line-height: 1.25; letter-spacing: -0.01em;
    opacity: .9; min-height: 1.25em;
  }

  .content { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }

  /* Werkzeugleiste (immer sichtbar) */
  .bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .6rem; }
  .bar .form { flex: 1 1 15rem; min-width: 12rem; }

  /* Szenario-Menü (ausklappbar) */
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 60;
    width: min(23rem, 88vw); background: #fff;
    border-right: 1.3px solid var(--line); box-shadow: 8px 0 30px rgba(201, 59, 135, .15);
    padding: var(--pad); overflow: auto;
    display: flex; flex-direction: column; gap: .5rem;
    transform: translateX(-104%); visibility: hidden;
    transition: transform .28s ease, visibility 0s linear .28s;
  }
  .drawer.open { transform: none; visibility: visible; transition: transform .28s ease; }
  .drawer .dhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: .2rem; }
  .backdrop {
    position: fixed; inset: 0; z-index: 55; background: rgba(201, 59, 135, .12);
    opacity: 0; pointer-events: none; transition: opacity .28s ease;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer h2 { margin: 0; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }

  /* Startbildschirm */
  .start {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(.8rem, 2.6vh, 1.6rem); padding: var(--pad); text-align: center;
    transition: opacity .45s ease, transform .45s ease;
  }
  .start.gone { opacity: 0; transform: scale(1.03); pointer-events: none; }
  .start .crest { width: clamp(4rem, 9vw, 6.5rem); }
  .start h1 { font-size: clamp(2rem, 6vw, 4.4rem); max-width: 18ch; }
  .start .lead { margin: 0; font-size: clamp(1rem, 2vw, 1.4rem); font-weight: 600; opacity: .85; max-width: 38ch; line-height: 1.35; }
  .start svg { width: min(68vw, 460px); max-height: 30vh; height: auto; }
  .go {
    font: inherit; font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: 700; letter-spacing: .08em;
    color: #fff; background: var(--pink); border: 0; border-radius: 999px;
    padding: .75em 2.6em; cursor: pointer; transition: background .2s ease, transform .15s ease;
  }
  .go:hover { background: #a82c6d; transform: translateY(-1px); }
  .go:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; }
  .scrow { display: flex; gap: .3rem; align-items: stretch; }
  .sc {
    flex: 1; text-align: left;
    font: inherit; font-size: .92rem; font-weight: 600; line-height: 1.25;
    color: var(--pink); background: #fff;
    border: 1.3px solid var(--pink); border-radius: 1rem;
    padding: .55rem .9rem; cursor: pointer;
    transition: background .2s ease, box-shadow .2s ease;
  }
  .sc:hover { background: var(--pink-soft); }
  .sc[aria-pressed="true"] { background: var(--pink-soft); box-shadow: 0 0 0 2.5px var(--pink); }
  .scdel {
    flex: none; width: 2rem;
    font: inherit; font-size: 1.1rem; color: var(--pink); background: #fff;
    border: 1.3px solid var(--line); border-radius: 1rem; cursor: pointer;
  }
  .scdel:hover { border-color: var(--pink); background: var(--pink-soft); }
  .btn {
    font: inherit; font-size: .92rem; font-weight: 600;
    color: var(--pink); background: #fff;
    border: 1.3px solid var(--pink); border-radius: 999px;
    padding: .45rem 1.1rem; cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .btn:hover { background: var(--pink); color: #fff; }
  .btn.primary { background: var(--pink); color: #fff; }
  .btn.primary:hover { background: #a82c6d; }
  .sc:focus-visible, .btn:focus-visible, .scdel:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }
  .form { display: flex; gap: .4rem; }
  .form[hidden] { display: none; }
  .form input {
    flex: 1; min-width: 0;
    font: inherit; font-size: .92rem; font-weight: 500;
    color: var(--pink); background: #fff;
    border: 1.3px solid var(--pink); border-radius: 999px; padding: .42rem .8rem;
  }
  .form input::placeholder { color: var(--pink); opacity: .45; }
  .form input:focus { outline: 2px solid var(--pink); outline-offset: 2px; }
  .form .btn { padding: .42rem .9rem; }
  .sep { border: 0; border-top: 1.3px dashed var(--line); margin: .5rem 0 .2rem; width: 100%; }
  .help { margin: .2rem 0 0; font-size: .82rem; font-weight: 500; line-height: 1.4; opacity: .7; }

  /* Bühne (feste Zeichenfläche 1000 × 640, wird skaliert) */
  .stagewrap { position: relative; min-height: 0; min-width: 0; }
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1000px; height: 640px;
    transform-origin: center center;
    user-select: none; -webkit-user-select: none;
  }
  .frame { position: absolute; left: 0; top: 0; pointer-events: none; }


  .pan { position: absolute; left: 0; top: 0; width: 340px; height: 170px; will-change: transform; }
  .pan svg { position: absolute; left: 0; top: 0; overflow: visible; transition: filter .15s ease; }
  .pan.over svg { filter: drop-shadow(0 0 9px rgba(201, 59, 135, .6)); }
  .load {
    position: absolute; left: 0; right: 0; bottom: 20px; z-index: 1;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
    gap: 6px; padding: 0 6px;
  }
  .plabel { position: absolute; left: 0; right: 0; top: 176px; text-align: center; font-size: 17px; font-weight: 700; line-height: 1.2; pointer-events: none; }
  .plabel small { display: block; margin-top: 1px; font-size: 13px; font-weight: 500; opacity: .7; }

  .tray {
    position: absolute; left: 0; top: 492px; width: 1000px; height: 148px;
    border: 1.3px dashed var(--line); border-radius: 18px;
    padding: 24px 12px 8px;
    display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; justify-content: center;
    overflow: auto; transition: background .15s ease, border-color .15s ease;
  }
  .tray.over { background: var(--pink-soft); border-color: var(--pink); }
  .tray::before {
    content: "Mögliche Folgen – auf eine Schale ziehen · Rechtsklick auf einen Kasten in der Schale: größer"; position: absolute; left: 16px; top: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .55;
  }
  .tray.idle::before { content: none; }
  .tray.idle:empty::after { content: "Wähle im Menü „Szenarien“ ein Szenario oder tippe oben eine eigene Frage ein."; }
  .tray:empty::after {
    content: "Noch keine Folgen. Oben eigene Kästchen beschriften und anlegen.";
    margin: auto; font-size: 14px; font-weight: 500; opacity: .6;
  }

  /* Kästen = Gewichte */
  .box {
    position: relative; flex: none;
    width: 108px; padding: 6px 8px;
    border: 1.3px solid var(--pink); border-radius: 10px;
    background: #fff; color: var(--pink);
    font-size: 11.5px; font-weight: 600; line-height: 1.25; text-align: center;
    cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none;
    box-shadow: 0 1.5px 0 var(--line);
    transition: width .22s ease, font-size .22s ease, background .22s ease;
  }
  .box[data-lv="2"] { width: 136px; font-size: 13.5px; background: var(--pink-soft); }
  .box[data-lv="3"] { width: 164px; font-size: 15.5px; background: var(--pink-mid); }
  .box.drag {
    position: absolute; z-index: 50; cursor: grabbing; pointer-events: none;
    box-shadow: 0 10px 22px rgba(201, 59, 135, .35); transition: none;
  }
  .badge {
    position: absolute; top: -9px; right: -9px;
    min-width: 21px; height: 21px; padding: 0 5px;
    border-radius: 11px; background: var(--pink); color: #fff;
    font-size: 11.5px; font-weight: 700;
    display: none; place-items: center;
  }
  .box[data-lv="2"] .badge, .box[data-lv="3"] .badge { display: grid; }
  .del {
    position: absolute; top: -8px; left: -8px;
    width: 19px; height: 19px; padding: 0;
    border-radius: 50%; border: 1.3px solid var(--pink); background: #fff; color: var(--pink);
    font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    display: none; place-items: center;
  }
  .tray .box.custom .del { display: grid; }

  @media (max-width: 900px) {
    main { height: auto; min-height: 100dvh; }
    .stagewrap { aspect-ratio: 1000 / 640; }
  }
</style>
</head>
<body>
<main>
  <header class="head">
    <span class="crest" role="img" aria-label="Schullogo"></span>
    <div>
      <h1>Das Glückskalkül des Konsequenzialismus</h1>
      <p class="sub" id="q"></p>
    </div>
  </header>

  <div class="bar">
    <button class="btn" id="menu" type="button" aria-expanded="false" aria-controls="drawer">☰ Szenarien</button>
    <div class="form" id="caseform">
      <input id="cq" type="text" maxlength="140" placeholder="Eigenes Szenario: Deine Frage …" aria-label="Eigenes Szenario beschreiben">
      <button class="btn primary" id="caseadd" type="button">Anlegen</button>
    </div>
    <div class="form" id="boxform">
      <input id="nb" type="text" maxlength="70" placeholder="Eigene Folge beschriften …" aria-label="Beschriftung des neuen Kastens">
      <button class="btn primary" id="boxadd" type="button" aria-label="Kasten anlegen">＋</button>
    </div>
    <button class="btn" id="reset" type="button">Waage leeren</button>
  </div>

  <div class="content">
    <div class="stagewrap" id="wrap">
      <div class="stage" id="stage">
        <svg class="frame" width="1000" height="640" viewBox="0 0 1000 640" aria-hidden="true">
          <rect x="394" y="456" width="212" height="20" rx="10" fill="#c93b87"/>
          <rect x="492" y="170" width="16" height="292" fill="#c93b87"/>
          <g id="beam">
            <rect x="214" y="163" width="572" height="14" rx="7" fill="#c93b87"/>
          </g>
          <circle cx="500" cy="170" r="15" fill="#c93b87"/>
          <circle cx="500" cy="170" r="5.5" fill="#fff"/>
        </svg>

        <div class="pan" id="panL">
          <svg width="340" height="170" viewBox="0 0 340 170">
            <g stroke="#c93b87" stroke-width="2" fill="none"><line x1="170" y1="0" x2="12" y2="152"/><line x1="170" y1="0" x2="328" y2="152"/></g>
            <path d="M0 150 H340 C336 164 322 170 300 170 H40 C18 170 4 164 0 150Z" fill="#c93b87"/>
            <circle cx="170" cy="0" r="7" fill="#fff" stroke="#c93b87" stroke-width="2.5"/>
          </svg>
          <div class="load" id="loadL"></div>
          <div class="plabel">Gute Konsequenzen<small id="wL">Gewicht 0</small></div>
        </div>
        <div class="pan" id="panR">
          <svg width="340" height="170" viewBox="0 0 340 170">
            <g stroke="#c93b87" stroke-width="2" fill="none"><line x1="170" y1="0" x2="12" y2="152"/><line x1="170" y1="0" x2="328" y2="152"/></g>
            <path d="M0 150 H340 C336 164 322 170 300 170 H40 C18 170 4 164 0 150Z" fill="#c93b87"/>
            <circle cx="170" cy="0" r="7" fill="#fff" stroke="#c93b87" stroke-width="2.5"/>
          </svg>
          <div class="load" id="loadR"></div>
          <div class="plabel">Schlechte Konsequenzen<small id="wR">Gewicht 0</small></div>
        </div>

        <div class="tray" id="tray"></div>
      </div>
    </div>
  </div>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Szenarien" aria-hidden="true">
  <div class="dhead"><h2>Szenarien</h2><button class="scdel" id="dclose" type="button" aria-label="Menü schließen">×</button></div>
  <div id="list" style="display:flex;flex-direction:column;gap:.5rem"></div>
  <hr class="sep">
  <p class="help">Kästen auf die linke oder rechte Schale ziehen. Rechtsklick (oder Doppelklick) auf einen Kasten in der Schale vergrößert ihn: Stufe 1, 2, 3, dann wieder 1. Größere Kästen wiegen mehr.</p>
</aside>

<section class="start" id="start" aria-label="Startbildschirm">
  <button class="go" id="go" type="button" autofocus>START</button>
</section>

<script>
(function () {
  var W = 1000, H = 640, PX = 500, PY = 170, ARM = 280, MAXA = 17, ZONE_Y = 485;

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), wrap = $('wrap'), tray = $('tray'), beam = $('beam');
  var pan = { L: $('panL'), R: $('panR') };
  var load = { L: $('loadL'), R: $('loadR') };

  /* ---------- Szenarien ---------- */
  var DATA = [
    { q: 'Sollte ich meine Eltern wegen meiner Note anlügen?', t: [
      'Heute Abend gibt es keinen Streit',
      'Ich muss nicht in ihre enttäuschten Gesichter schauen',
      'Ich kann die Note erst mal in Ruhe selbst ausbügeln',
      'Im Bauch bleibt dieses flaue Gefühl',
      'Ich muss mir merken, was ich ihnen erzählt habe',
      'Fliegt es auf, glauben sie mir lange nichts mehr',
      'Nachhilfe gibt es keine, weil sie von nichts wissen',
      'Spätestens im Zeugnis kommt es raus',
      'Für die nächste Lüge bin ich schon mittendrin'
    ] },
    { q: 'Sollte ich im Unterricht stören?', t: [
      'Alle lachen, kurz bin ich der Held',
      'Die Stunde ist weniger langweilig',
      'Endlich beachtet mich mal jemand',
      'Ich baue meinen Frust ab',
      'Die anderen kommen nicht mehr mit',
      'Eintrag ins Klassenbuch, Anruf zu Hause',
      'Ich verpasse selbst, was drankommt',
      'Die Lehrerin ist genervt und die Stimmung ist dahin',
      'Bei manchen bin ich bald der Störenfried'
    ] },
    { q: 'Sollte ich in der Klassenarbeit schummeln?', t: [
      'Bessere Note, weniger Druck',
      'Zuhause gibt es Lob statt Ärger',
      'Die Panik vor der Arbeit ist weg',
      'Die Versetzung wackelt nicht mehr',
      'Ich werde erwischt: Sechs und Gespräch mit den Eltern',
      'Ich kann den Stoff nicht, die nächste Arbeit wird noch härter',
      'Hinterher fühle ich mich mies',
      'Wer ehrlich gelernt hat, steht schlechter da als ich',
      'Die Lehrerin behält mich ab jetzt im Auge',
      'Es hat geklappt, also mache ich es wieder'
    ] },
    { q: 'Sollte ich meiner Freundin sagen, dass jemand hinter ihrem Rücken über sie lästert?', t: [
      'Sie weiß Bescheid und kann sich wehren',
      'Sie merkt: Auf mich kann ich mich verlassen',
      'Ich muss das nicht mehr für mich behalten',
      'Vielleicht hört das Lästern auf',
      'Sie ist verletzt und heult',
      'In der Clique gibt es Zoff',
      'Die Lästerin ist sauer auf mich',
      'Vielleicht war es gar nicht so gemeint'
    ] },
    { q: 'Sollte ich Geld spenden, statt mir ein neues Handy zu kaufen?', t: [
      'Das Geld hilft Menschen, die es wirklich brauchen',
      'Ich bin stolz auf mich',
      'Meine Freunde überlegen, auch mal zu spenden',
      'Ich merke, was ich wirklich brauche',
      'Mein altes Handy ruckelt und nervt weiter',
      'Bei Spielen und Fotos hinke ich hinterher',
      'Ein paar in der Klasse machen Sprüche',
      'Keiner weiß, wie viel davon wirklich ankommt'
    ] },
    { q: 'Sollte ich bei einem Streit auf dem Schulhof eingreifen?', t: [
      'Der Betroffene ist nicht mehr allein',
      'Andere trauen sich auch dazwischenzugehen',
      'Ich bin froh, nicht weggesehen zu haben',
      'Der Streit ist schneller vorbei',
      'Ich kriege selbst eine ab',
      'Die Täter haben mich danach auf dem Kieker',
      'Ich mache es vielleicht noch schlimmer',
      'Die Aufsicht denkt, ich gehöre dazu'
    ] }
  ];

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  /* ---------- Kästen ---------- */
  function makeBox(text, custom) {
    var el = document.createElement('div');
    el.className = 'box' + (custom ? ' custom' : '');
    el.setAttribute('data-lv', '1');
    var span = document.createElement('span'); span.textContent = text;
    var badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = '×1';
    el.appendChild(span); el.appendChild(badge);
    if (custom) {
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', 'Kasten löschen');
      el.appendChild(del);
    }
    var b = { el: el, text: text, side: null, level: 1, badge: badge };
    el._b = b;
    return b;
  }
  function setLevel(b, lv) {
    b.level = lv;
    b.el.setAttribute('data-lv', lv);
    b.badge.textContent = '×' + lv;
  }
  function attach(b) {
    var host = b.side === 'L' ? load.L : b.side === 'R' ? load.R : tray;
    b.el.classList.remove('drag');
    b.el.style.left = ''; b.el.style.top = '';
    host.appendChild(b.el);
  }
  function place(b, side) {
    b.side = side;
    if (!side) setLevel(b, 1);
    attach(b);
    update();
  }

  var scenarios = DATA.map(function (d) {
    return { q: d.q, custom: false, boxes: shuffle(d.t.slice()).map(function (t) { return makeBox(t, false); }) };
  });
  var cur = null;

  function renderScenario() {
    tray.innerHTML = ''; load.L.innerHTML = ''; load.R.innerHTML = '';
    tray.classList.toggle('idle', !cur);
    if (cur) cur.boxes.forEach(attach);
    $('q').textContent = cur ? cur.q : '';
    update();
    renderList();
  }

  /* ---------- Waage ---------- */
  var ang = 0, vel = 0, target = 0, running = false, last = 0;

  function weights() {
    var l = 0, r = 0;
    if (cur) cur.boxes.forEach(function (b) { if (b.side === 'L') l += b.level; else if (b.side === 'R') r += b.level; });
    return [l, r];
  }
  function update() {
    var w = weights(), wl = w[0], wr = w[1];
    $('wL').textContent = 'Gewicht ' + wl;
    $('wR').textContent = 'Gewicht ' + wr;
    setTarget(MAXA * Math.tanh((wr - wl) / 7));
  }
  function setTarget(t) {
    target = t;
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
  }
  function step(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    vel += (70 * (target - ang) - 6.5 * vel) * dt;
    ang += vel * dt;
    draw();
    if (Math.abs(vel) < 0.02 && Math.abs(target - ang) < 0.02) { ang = target; vel = 0; draw(); running = false; return; }
    requestAnimationFrame(step);
  }
  function draw() {
    var rad = ang * Math.PI / 180, c = Math.cos(rad), s = Math.sin(rad);
    beam.setAttribute('transform', 'rotate(' + ang.toFixed(3) + ' ' + PX + ' ' + PY + ')');
    pan.L.style.transform = 'translate(' + (PX - ARM * c - 170).toFixed(2) + 'px,' + (PY - ARM * s).toFixed(2) + 'px)';
    pan.R.style.transform = 'translate(' + (PX + ARM * c - 170).toFixed(2) + 'px,' + (PY + ARM * s).toFixed(2) + 'px)';
  }

  /* ---------- Ziehen ---------- */
  var drag = null;
  function toDesign(e) {
    var r = stage.getBoundingClientRect(), k = r.width / W;
    return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k, k: k };
  }
  function zoneAt(p) { return p.y > ZONE_Y ? 'T' : (p.x < PX ? 'L' : 'R'); }
  function mark(z) {
    pan.L.classList.toggle('over', z === 'L');
    pan.R.classList.toggle('over', z === 'R');
    tray.classList.toggle('over', z === 'T');
  }
  function moveBox(p) {
    drag.el.style.left = (p.x - drag.offX) + 'px';
    drag.el.style.top = (p.y - drag.offY) + 'px';
  }

  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || e.target.closest('.del')) return;
    var el = e.target.closest('.box');
    if (!el || el.classList.contains('drag')) return;
    e.preventDefault();
    var r = el.getBoundingClientRect(), k = stage.getBoundingClientRect().width / W;
    drag = {
      b: el._b, el: el, started: false, sx: e.clientX, sy: e.clientY,
      offX: (e.clientX - r.left) / k, offY: (e.clientY - r.top) / k
    };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.started) {
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 5) return;
      drag.started = true;
      drag.origSide = drag.b.side;
      stage.appendChild(drag.el);
      drag.el.classList.add('drag');
      drag.b.side = null;
      update();
    }
    var p = toDesign(e);
    moveBox(p);
    mark(zoneAt(p));
  });
  function endDrag(e) {
    if (!drag) return;
    var d = drag; drag = null;
    mark(null);
    if (!d.started) return;
    var z = zoneAt(toDesign(e));
    place(d.b, z === 'T' ? null : z);
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* Größe ändern: Rechtsklick oder Doppelklick auf Kasten in der Schale */
  function cycle(e) {
    var el = e.target.closest && e.target.closest('.box');
    if (!el || drag) return;
    var b = el._b;
    if (!b.side) return;
    setLevel(b, b.level % 3 + 1);
    update();
  }
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); cycle(e); });
  stage.addEventListener('dblclick', cycle);

  /* Eigene Kästen löschen */
  stage.addEventListener('click', function (e) {
    var d = e.target.closest('.del');
    if (!d) return;
    var b = d.parentNode._b;
    cur.boxes.splice(cur.boxes.indexOf(b), 1);
    b.el.remove();
    update();
  });

  /* ---------- Seitenleiste ---------- */
  var list = $('list');
  function renderList() {
    list.innerHTML = '';
    scenarios.forEach(function (s) {
      var row = document.createElement('div'); row.className = 'scrow';
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'sc'; b.textContent = s.q;
      b.setAttribute('aria-pressed', s === cur);
      b.addEventListener('click', function () { if (cur !== s) { cur = s; renderScenario(); } closeDrawer(); });
      row.appendChild(b);
      if (s.custom) {
        var x = document.createElement('button');
        x.type = 'button'; x.className = 'scdel'; x.textContent = '×'; x.setAttribute('aria-label', 'Fall löschen');
        x.addEventListener('click', function () {
          scenarios.splice(scenarios.indexOf(s), 1);
          if (cur === s) { cur = null; renderScenario(); } else renderList();
        });
        row.appendChild(x);
      }
      list.appendChild(row);
    });
  }

  function addCase() {
    var v = $('cq').value.trim();
    if (!v) return;
    var s = { q: v, custom: true, boxes: [] };
    scenarios.push(s); cur = s;
    $('cq').value = '';
    renderScenario();
    $('nb').focus();
  }
  function addBox() {
    var v = $('nb').value.trim();
    if (!v) return;
    if (!cur) { $('cq').focus(); return; }
    var b = makeBox(v, true);
    cur.boxes.push(b);
    attach(b);
    $('nb').value = ''; $('nb').focus();
  }
  function onEnter(fn) { return function (e) { if (e.key === 'Enter') { e.preventDefault(); fn(); } }; }
  $('caseadd').addEventListener('click', addCase);
  $('boxadd').addEventListener('click', addBox);
  $('cq').addEventListener('keydown', onEnter(addCase));
  $('nb').addEventListener('keydown', onEnter(addBox));
  $('reset').addEventListener('click', function () {
    if (!cur) return;
    cur.boxes.forEach(function (b) { b.side = null; setLevel(b, 1); });
    renderScenario();
  });

  /* ---------- Menü und Start ---------- */
  var drawer = $('drawer'), backdrop = $('backdrop'), menuBtn = $('menu');
  function openDrawer() {
    drawer.classList.add('open'); backdrop.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false'); menuBtn.setAttribute('aria-expanded', 'true');
  }
  function closeDrawer() {
    drawer.classList.remove('open'); backdrop.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true'); menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', function () { drawer.classList.contains('open') ? closeDrawer() : openDrawer(); });
  $('dclose').addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  var startEl = $('start');
  $('go').addEventListener('click', function () {
    startEl.classList.add('gone');
    setTimeout(function () { startEl.hidden = true; startEl.style.display = 'none'; }, 500);
  });
  $('go').focus();

  /* ---------- Skalierung ---------- */
  function fit() {
    var r = wrap.getBoundingClientRect();
    var s = Math.min(r.width / W, r.height / H);
    if (!(s > 0)) return;
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap);

  cur = null;
  renderScenario();
  draw();
  fit();
})();
</script>
</body>
</html>
